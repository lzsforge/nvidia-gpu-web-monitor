<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统 GPU & CPU 监控系统</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/style.css?v=20260526.5">
</head>
<body>
    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal" style="display: none;">
        <div class="modal-content glass-card">
            <div class="login-header">
                <div class="logo-glow">
                    <i data-lucide="cpu" class="logo-icon"></i>
                </div>
                <h2>系统 GPU &amp; CPU 监控</h2>
                <p>请输入安全访问密钥以连接到控制台</p>
            </div>
            
            <div class="input-wrapper">
                <i data-lucide="key" class="input-icon"></i>
                <input type="password" id="auth-key-input" placeholder="请输入 Auth Key...">
            </div>
            
            <button onclick="saveAuthKey()" class="btn-primary">
                <span>保存并登录</span>
                <i data-lucide="arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" style="display: none;">
        <header class="main-header glass-card">
            <div class="header-left">
                <div class="brand">
                    <div class="brand-logo">
                        <i data-lucide="activity" class="brand-icon"></i>
                    </div>
                    <div>
                        <h1>NVIDIA GPU &amp; CPU 监控系统</h1>
                        <span class="sub-brand">实时硬件状态监控与风扇控制</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <!-- Theme Selector pill -->
                <div class="theme-selector-container">
                    <button class="theme-btn" id="theme-btn-light" onclick="setTheme('light')" title="白天模式">
                        <i data-lucide="sun"></i>
                    </button>
                    <button class="theme-btn" id="theme-btn-dark" onclick="setTheme('dark')" title="夜晚模式">
                        <i data-lucide="moon"></i>
                    </button>
                    <button class="theme-btn" id="theme-btn-system" onclick="setTheme('system')" title="跟随系统">
                        <i data-lucide="laptop"></i>
                    </button>
                </div>
                
                <button onclick="logout()" class="logout-btn btn-danger">
                    <i data-lucide="log-out"></i>
                    <span>安全退出</span>
                </button>
            </div>
        </header>
        
        <div id="error-message" class="error-msg glass-card" style="display: none;">
            <i data-lucide="alert-triangle"></i>
            <span class="error-text"></span>
        </div>
        
        <main class="dashboard-main">
            <!-- Systems Grid -->
            <div id="cpu-container" class="gpu-grid"></div>
            <div id="gpu-container" class="gpu-grid">
                <!-- GPU cards will be injected here -->
            </div>
        </main>
    </div>

    <script src="/app.js?v=20260526.5"></script>
</body>
</html>
